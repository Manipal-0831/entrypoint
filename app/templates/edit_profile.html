{% extends "base.html" %}
{% block title %}Edit profile &middot; EntryPoint{% endblock %}

{% block content %}
<div class="narrow-form">
  <h1>Edit your profile</h1>
  <form method="post">
    <label for="bio">Bio</label>
    <textarea id="bio" name="bio" maxlength="280" rows="4">{{ current_user.bio or '' }}</textarea>
    <button type="submit" class="btn-primary">Save</button>
  </form>
</div>
{% endblock %}
