{% extends "base.html" %}
{% block title %}Sign up &middot; EntryPoint{% endblock %}

{% block content %}
<div class="auth-panel">
  <h1>Join EntryPoint</h1>
  <p class="muted">One account — browse jobs, save the ones you like, and post any opening you come across.</p>
  <form method="post" class="narrow-form">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" required value="{{ name or '' }}" autofocus>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required value="{{ email or '' }}">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="6">

    <button type="submit" class="btn-primary">Create account</button>
  </form>
  <p class="muted">Already have one? <a href="{{ url_for('auth.login') }}">Log in</a>.</p>
</div>
{% endblock %}
